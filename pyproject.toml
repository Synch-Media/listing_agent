[project]
name = "goodeals-listing-agent"
version = "0.1.0"
description = "Local editor and copy workspace for GoodeDeals listing JSON packages."
requires-python = ">=3.12"
dependencies = [
    "streamlit>=1.62.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.0",
    "ruff>=0.12.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
